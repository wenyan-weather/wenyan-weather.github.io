<!DOCTYPE html>
<html>
  <head>
    <title>天下無恙</title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Should this be by height instead of width for tategaki? -->
    <meta charset="utf-8">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.7.5/lunar.min.js"></script>

    <link rel="stylesheet" href="style.css">
    <script src="index.js" type="module"></script>
  </head>
  <body>
    <h1 id="curr-weather">方求氣候</h1>

    <div class="widget">
      <span class="one-line">
        <b>農曆</b>
        <span id="lunar-date">不明</span>
        &#12288;
        <span id="curr-jieqi">不明</span>
      </span>

      <span class="one-line">
        <b id="alt-calendar-name">西曆</b>
        <span id="western-date">不明</span>
      </span>
    </div>

    <table id="hourly" class="widget force-rtl" dir="rtl">
      <tr>
        <td><!--This column is for sunrise/sunset--></td>
        <th>今</th>
        <td id="curr-hour-weather">不明</td>
        <td id="curr-hour-temp" class="left-align"></td>
      </tr>
    </table>

    <div id="wind" class="widget">
      <b>風</b>
      <span id="wind-info">不明</span>
    </div>

    <table id="daily" class="widget">
      <tr>
        <td id="today-solar-term"></td>
        <th>今日</th>
        <td id="today-weather">不明</td>
        <td id="today-high"></td>
        <td id="today-low"></td>
      </tr>
    </table>

    <form id="settings">
      <h3>設</h3>

      <table>
        <tr>
          <td><label for="year-numbering-select">年號</label></td>
          <td><select name="year-numbering" id="year-numbering-select">
            <option value="western">西曆</option>
            <option value="japan">年号（日本）</option>
            <option value="taiwan">中華民國</option>
            <option value="huangdi">黃帝（華夏）</option>
            <option value="kouki">皇紀（日本）</option>
            <option value="buddhist">佛歷</option>
            <option value="dangun">檀君（大韓民國）</option>
            <option value="juche">主體（北朝鮮）</option>
            <option value="murica-lunar">星條旗（美國，農曆）</option>
            <option value="murica-solar">星條𣄃（美國，西曆）</option>
          </select></td>
          <td class="notice">「星條𣄃（美國，西曆）」者，年初獨立日也。</td>
        </tr>
        <tr>
          <td><label for="weekday-type-select">週日名</label></td>
          <td><select name="weekday-type" id="weekday-type-select">
            <option value="yaori">曜日</option>
            <option value="number">星期</option>
            <option value="mansions">二十八宿</option>
          </select></td>
        </tr>
        <tr>
          <td><label for="font-select">字體</label></td>
          <td><select name="font" id="font-select">
            <option value="cursive">楷書</option>
            <option value="sans-serif">黑體</option>
            <option value="serif">宋體</option>
          </select></td>
        </tr>
        <tr>
          <td><label for="zero-symbol-select">無數代字</label></td>
          <td><select name="zero-symbol" id="zero-symbol-select">
            <option value="circle">〇</option>
            <option value="char">零</option>
          </select></td>
        </tr>
        <tr>
          <td><label for="short-nums-select">廿卅卌省字</label></td>
          <td><input type="checkbox" name="short-nums" id="short-nums-select" checked></td>
        </tr>
        <!--
        <tr>
          <td><label for="hourly-dir-select">每日氣候</label></td>
          <td><select name="hourly-dir" id="hourly-dir-select">
            <option value="rtl">自右而左</option>
            <option value="ltr">自左而右</option>
          </select></td>
        </tr>
        -->
      </table>

      <p class="notice">更新網站，所設留此。</p>
    </form>

    <h3>注</h3>
    <footer>
      時辰、日月、氣候每卅秒自新。

      建本站者號<u>巍洰</u>，無非人工也。欲輔建之，請適<a href="https://github.com/wenyan-weather/wenyan-weather.github.io">Github</a>。
      <br>
      本站以<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>用<a href="https://open-meteo.com/">Open-Meteo</a>，氣候求焉。照片皆自<a href="https://unsplash.com/">Unsplash</a>，以<a href="https://unsplash.com/license">Unsplash執照</a>取也。影像之CSS從<a href="https://www.joshwcomeau.com/css/designing-shadows/">Josh Comeau</a>之網站所勸。
    </footer>
  </body>
</html>
